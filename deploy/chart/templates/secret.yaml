{{- if not .Values.servicenow.existingSecret }}
{{- if not .Values.servicenow.instanceUrl }}
{{- fail "servicenow.instanceUrl is required (or set servicenow.existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "servicenow-mcp.fullname" . }}
  labels:
    {{- include "servicenow-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  SNOW_INSTANCE_URL: {{ .Values.servicenow.instanceUrl | quote }}
  SNOW_USERNAME: {{ .Values.servicenow.username | quote }}
  SNOW_PASSWORD: {{ .Values.servicenow.password | quote }}
{{- end }}
