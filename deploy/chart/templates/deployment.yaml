apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "servicenow-mcp.fullname" . }}
  labels:
    {{- include "servicenow-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "servicenow-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "servicenow-mcp.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if not .Values.servicenow.existingSecret }}
        # Roll pods when chart-managed credentials change.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: servicenow-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: SNOW_MCP_TRANSPORT
              value: {{ .Values.transport | quote }}
            - name: SNOW_TIMEOUT_SECONDS
              value: {{ .Values.servicenow.timeoutSeconds | quote }}
          envFrom:
            - secretRef:
                name: {{ include "servicenow-mcp.secretName" . }}
          # The MCP endpoint needs a session to answer GET, so probe the TCP port.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
